name: CTSI builder tests
on:
  push:
    branches:
      - feature/ctsi-poster-templates
  workflow_dispatch:
jobs:
  builder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run builder regression tests
        run: node --test tests/builder.test.cjs
